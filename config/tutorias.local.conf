<VirtualHost *:80>
    ServerName tutorias.local
    DocumentRoot "[DIRECCION DE PROYECTO]"

    <Directory "[DIRECCION DE PROYECTO]">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://localhost:9090/api
    ProxyPassReverse /api http://localhost:9090/api

    ErrorLog ${APACHE_LOG_DIR}/tutorias.local-error.log
    CustomLog ${APACHE_LOG_DIR}/tutorias.local-access.log combined
</VirtualHost>
