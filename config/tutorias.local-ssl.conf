<VirtualHost *:443>
    ServerName tutorias.local
    DocumentRoot "[DIRECCION DE PROYECTO]"

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/apache2/ssl/tutorias.local/tutorias.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/tutorias.local/tutorias.local-key.pem

    <Directory "[DIRECCION DE PROYECTO]">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://localhost:9090/api
    ProxyPassReverse /api http://localhost:9090/api

    ErrorLog ${APACHE_LOG_DIR}/tutorias.local-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/tutorias.local-ssl-access.log combined
</VirtualHost>
